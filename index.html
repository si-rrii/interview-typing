<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>면접 답변 타자연습</title>
<style>
:root{--bg:#FBFAF7;--card:#FFFFFF;color-scheme:light;--tx:#3a2e2c;--sub:#8a7568;--line:#e9e5dc;--ac:#A36C6C;--acbg:#f5ece8;--ok:#758C6F;--mid:#C27F5C;--bad:#B0524E;--hint:#a8a398;--missbg:#f6dcd3;--onac:#fff;--ex:#8a6a1f;--exbg:#F3E2BE;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}


*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"Pretendard","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;line-height:1.6}
.wrap{max-width:980px;margin:0 auto;padding:20px 16px 60px}
h1{font-size:20px;margin:0 0 4px}
.sub{color:var(--sub);font-size:13px;margin:0 0 18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:14px}
button,.btn{font:inherit;font-size:14px;border:1px solid var(--line);background:var(--card);color:var(--tx);padding:8px 14px;border-radius:9px;cursor:pointer}
button:hover,.btn:hover{border-color:var(--ac)}
button.pri,.btn.pri{background:var(--ac);border-color:var(--ac);color:var(--onac)}
button.pri:hover{opacity:.9}
button:disabled{opacity:.4;cursor:default}
textarea{width:100%;font:inherit;font-size:15px;color:var(--tx);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px;resize:vertical;line-height:1.7}
textarea:focus{outline:2px solid var(--ac);outline-offset:-1px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sp{flex:1}
.hintfmt{font-size:12px;color:var(--sub);white-space:pre-wrap;background:var(--bg);border-radius:8px;padding:10px;margin:10px 0}
.q{font-size:18px;font-weight:600;margin:6px 0 12px}
.tag{font-size:12px;color:var(--sub)}
.hint{color:var(--hint);background:var(--bg);border:1px dashed var(--line);border-radius:10px;padding:12px;margin:10px 0;white-space:pre-wrap;font-size:15px;line-height:1.7}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.chip{min-width:34px;padding:4px 8px;font-size:13px;border-radius:8px}
.chip.cur{border-color:var(--ac);background:var(--acbg)}
.chip.s-ok{color:var(--ok)}.chip.s-mid{color:var(--mid)}.chip.s-bad{color:var(--bad)}
.score{font-size:34px;font-weight:700}
.bar{height:8px;border-radius:4px;background:var(--line);overflow:hidden;margin:8px 0}
.bar i{display:block;height:100%;background:var(--ac)}
.diff{white-space:pre-wrap;font-size:15px;line-height:1.8}
.diff mark{background:var(--missbg);color:var(--bad);border-radius:3px}
.diff mark.ex{background:var(--exbg);color:var(--ex)}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.col{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px;min-width:0}
.col h4{margin:0 0 6px;font-size:13px;color:var(--sub);font-weight:600}
.legend{font-size:12px;color:var(--sub)}
input.tx{width:100%;font:inherit;font-size:15px;color:var(--tx);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
input.tx:focus{outline:2px solid var(--ac);outline-offset:-1px}
.kws{display:flex;gap:6px;flex-wrap:wrap;margin:-4px 0 10px}
.kw{font-size:12px;padding:2px 9px;border-radius:999px;background:var(--acbg);color:var(--ac)}
.kw.ok{color:var(--ok)}.kw.no{color:var(--bad)}
.pv{border:1px solid var(--line);border-radius:10px;margin-top:8px;background:var(--bg)}
.pv summary{padding:10px 12px;cursor:pointer;font-weight:600;font-size:14px}
.pv .pa{padding:0 12px 12px;white-space:pre-wrap;font-size:14px;line-height:1.7;color:var(--sub)}
.pv .mine{color:var(--tx);border-top:1px dashed var(--line);margin:0 12px 10px;padding:8px 0 0}
.ord{display:flex;align-items:center;gap:8px;padding:6px 8px;border:1px solid var(--line);border-radius:8px;margin-top:6px;background:var(--bg);cursor:grab}
.ord.cur{border-color:var(--ac)}.ord.over{border-color:var(--ac);background:var(--acbg)}
.ord .h{color:var(--sub)}.ord .n{width:22px;color:var(--sub);font-size:13px}
.ord .t{flex:1;font-size:14px;cursor:pointer;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ord button{padding:2px 8px;font-size:12px}
.legend b.r{color:var(--bad)}.legend b.b{color:var(--ex)}
@media (max-width:640px){.cols{grid-template-columns:1fr}}
.hide{display:none}
.cnt{font-size:12px;color:var(--sub);text-align:right}
</style>
</head>
<body>
<div class="wrap">
  <h1>면접 답변 타자연습</h1>
  <p class="sub">질문을 보고 백지에서 직접 답변을 쳐보세요. 원래 답변과 얼마나 일치하는지 알려줘요.</p>

  <div class="card" id="loader">
    <div class="row">
      <label class="btn pri">파일 업로드 (.txt .csv .json)<input type="file" id="file" accept=".txt,.csv,.tsv,.json,.md" hidden></label>
      <button id="sample">예시 불러오기</button><button id="tpl">양식 다운로드</button>
      <span class="sp"></span>
      <button id="clear">초기화</button>
    </div>
    <div class="hintfmt">양식 다운로드 → 내용 채우기 → 업로드 순서로 하면 가장 쉽습니다.

지원 형식
Q: 질문 내용
A: 답변 내용 (여러 줄 가능)

또는 CSV(질문,답변 두 열) / JSON([{"q":"...","a":"..."}])</div>
    <textarea id="paste" rows="5" placeholder="여기에 질문/답변을 붙여넣고 아래 버튼을 누르세요"></textarea>
    <div class="row" style="margin-top:10px"><button class="pri" id="load">붙여넣은 내용으로 시작</button><span class="tag" id="loadmsg"></span></div>
  </div>

  <div class="card hide" id="editPanel">
    <div class="tag" id="editTitle">질문 수정</div>
    <textarea id="eq" rows="2" placeholder="질문" style="margin-top:6px"></textarea>
    <textarea id="ea" rows="8" placeholder="답변" style="margin-top:8px"></textarea>
    <input class="tx" id="ek" type="text" placeholder="키워드 (쉼표로 구분, 예: 데이터 분석, AI, 경제학)" style="margin-top:8px">
    <div class="row" style="margin-top:10px"><button class="pri" id="esave">저장</button><button id="ecancel">취소</button></div>
  </div>

  <div id="preview" class="hide">
    <div class="card">
      <div class="row"><b id="pvTitle"></b><span class="sp"></span><button id="pvAdd">+ 질문 추가</button><button id="pvLoad">다른 파일</button><button id="pvToggle">모두 펼치기</button><button class="pri" id="pvStart">시작하기</button></div>
      <div class="row" style="margin-top:12px"><span class="tag">저장 · 내보내기</span><button id="ex1">질문·답변 .txt</button><button id="ex2">내 답변 포함 .txt</button><button id="ex3">백업 .json</button><span class="tag" id="exmsg"></span></div>
      <div id="pvList"></div>
    </div>
  </div>

  <div id="app" class="hide">
    <div class="chips" id="chips"></div>
    <div class="card hide" id="orderPanel">
      <div class="row"><b style="font-size:14px">순서 편집</b><span class="tag">드래그하거나 ▲▼로 옮기세요</span><span class="sp"></span><button id="addBtn">+ 질문 추가</button><button id="introBtn">자기소개 맨 앞으로</button></div>
      <div id="orderList"></div>
    </div>

    <div class="card">
      <div class="row"><span class="tag" id="pos"></span><span class="sp"></span><span class="tag" id="best"></span><button class="chip" id="cedit">수정</button><button class="chip" id="cdel">삭제</button></div>
      <div class="q" id="q"></div>
      <div class="kws" id="kws"></div>
      <textarea id="ans" rows="8" placeholder="답변을 처음부터 직접 입력하세요" spellcheck="false"></textarea>
      <div class="cnt"><span id="saved"></span><span id="len">0</span>자</div>
      <div class="hint hide" id="hint"></div>
      <div class="row" style="margin-top:10px">
        <button id="prev">이전</button>
        <button id="next">다음</button>
        <button id="shuf">셔플</button>
        <span class="sp"></span>
        <button id="peek">답변 보기</button>
        <button class="pri" id="grade">채점</button>
        <button id="reset">다시 쓰기</button>
      </div>
    </div>
    <div class="card hide" id="result">
      <div class="row"><div class="score" id="pct"></div><span class="sp"></span><button id="undo" class="hide">이전 원문 복구</button><button id="adopt">내 답변을 원문으로 저장</button></div>
      <div class="tag" id="kwres"></div>
      <div class="bar"><i id="barfill"></i></div>
      <div class="legend"><b class="r">빨강</b> 원문에 있는데 내가 못 쓴 부분 · <b class="b">황토색</b> 내가 쓴 것 중 원문과 다른 부분</div>
      <div class="cols">
        <div class="col"><h4>내가 쓴 답변</h4><div class="diff" id="diffMine"></div></div>
        <div class="col"><h4>원문</h4><div class="diff" id="diff"></div></div>
      </div>
    </div>
  </div>
</div>

<script>
const $=id=>document.getElementById(id);
let items=[],idx=0,best={},peeked=false,dragFrom=0;
const KEY="interview-typing-v1";

function save(){try{localStorage.setItem(KEY,JSON.stringify({items,best}))}catch(e){}}
function restore(){try{const d=JSON.parse(localStorage.getItem(KEY)||"null");if(d&&d.items&&d.items.length){items=d.items;best=d.best||{};return true}}catch(e){}return false}

function parseCSV(t){const rows=[];let r=[],c="",q=false;const d=t.indexOf("\t")>-1&&t.indexOf(",")<0?"\t":",";
  for(let i=0;i<t.length;i++){const ch=t[i];
    if(q){if(ch=='"'){if(t[i+1]=='"'){c+='"';i++}else q=false}else c+=ch}
    else if(ch=='"')q=true;else if(ch===d){r.push(c);c=""}
    else if(ch=="\n"){r.push(c);rows.push(r);r=[];c=""}else if(ch!="\r")c+=ch}
  if(c||r.length){r.push(c);rows.push(r)}
  return rows.filter(r=>r.length>=2&&r[0].trim()&&r[1].trim()).map(r=>({q:r[0].trim(),a:r[1].trim(),k:(r[2]||"").trim()}));}

function parseText(t){
  const out=[];let cur=null,mode=null;
  const qre=/^\s*(?:Q|질문)\s*\d*\s*[.:：)\]]\s*(.*)$/i,are=/^\s*(?:A|답변|답)\s*\d*\s*[.:：)\]]\s*(.*)$/i,cre=/^\s*(?:코멘트|comment)\s*[.:：]/i,kre=/^\s*(?:K|키워드)\s*[.:：)\]]\s*(.*)$/i;
  for(const line of t.split(/\r?\n/)){
    let m;
    if(m=line.match(qre)){cur={q:m[1],a:""};out.push(cur);mode="q"}
    else if(m=line.match(are)){if(!cur){cur={q:"",a:""};out.push(cur)}cur.a=m[1];mode="a"}
    else if(m=line.match(kre)){if(!cur){cur={q:"",a:""};out.push(cur)}cur.k=m[1];mode="k"}
    else if(cre.test(line)){mode="c"}
    else if(cur&&mode==="q")cur.q+="\n"+line;
    else if(cur&&mode==="a")cur.a+="\n"+line;
  }
  let res=out.map(x=>({q:x.q.trim(),a:x.a.trim(),k:(x.k||"").trim()})).filter(x=>x.q&&x.a);
  if(res.length)return res;
  return t.split(/\n\s*\n/).map(b=>b.trim().split("\n")).filter(l=>l.length>1).map(l=>({q:l[0].trim(),a:l.slice(1).join("\n").trim()}));
}

function parse(text,name){
  text=text.replace(/^\uFEFF/,"").trim();
  if(/^[\[{]/.test(text)){try{
    let j=JSON.parse(text);window.__best=(!Array.isArray(j)&&j.best)||null;if(!Array.isArray(j))j=j.items||j.data||Object.entries(j).map(([q,a])=>({q,a}));
    return j.map(o=>({q:String(o.q??o.question??o["질문"]??"").trim(),a:String(o.a??o.answer??o["답변"]??"").trim(),m:o.m?String(o.m):"",k:o.k?String(o.k):"",p:o.p?String(o.p):""})).filter(o=>o.q&&o.a);
  }catch(e){}}
  if(/\.(csv|tsv)$/i.test(name||""))return parseCSV(text);
  return parseText(text);
}

function start(list){
  if(!list.length){$("loadmsg").textContent="질문/답변을 찾지 못했어요. 형식을 확인해 주세요.";return false}
  const bk=window.__best;items=bk?list:introFirst(list);idx=0;best=bk||{};window.__best=null;save();showPreview();return true;
}

function showPreview(){
  $("loader").classList.add("hide");$("app").classList.add("hide");$("preview").classList.remove("hide");
  $("pvTitle").textContent="질문 "+items.length+"개 · 시작 전에 확인하세요";
  const box=$("pvList");box.innerHTML="";
  items.forEach((it,i)=>{
    const d=document.createElement("details");d.className="pv";
    const s=document.createElement("summary");s.textContent=(i+1)+". "+it.q+(best[it.q]!=null?"  · 최고 "+best[it.q]+"%":"")+(it.m?"  ✎":"");
    const p=document.createElement("div");p.className="pa";p.textContent=it.a+(it.k?"\n\n[키워드] "+it.k:"");
    const bar=document.createElement("div");bar.className="row";bar.style.padding="0 12px 12px";
    const eb=document.createElement("button");eb.textContent="수정";eb.onclick=()=>editItem(i);
    const db=document.createElement("button");db.className="dbtn";db.textContent=delArm===i?"확인?":"삭제";db.onclick=e=>delItem(i,e.currentTarget);
    bar.append(eb,db);d.append(s,p);
    if(it.m){const mm=document.createElement("div");mm.className="pa mine";mm.textContent="[내 답변]\n"+it.m;d.append(mm)}
    d.append(bar);box.appendChild(d);
  });
  $("pvToggle").textContent="모두 펼치기";
}
function show(){
  $("preview").classList.add("hide");
  $("app").classList.remove("hide");
  $("loader").classList.add("hide");
  renderChips();renderQ();
}
const isIntro=it=>/자기\s*소개/.test(it.q);
function introFirst(list){return list.map((it,i)=>({it,i})).sort((a,b)=>(isIntro(b.it)-isIntro(a.it))||(a.i-b.i)).map(x=>x.it)}
function refreshNav(){$("pos").textContent=(idx+1)+" / "+items.length;$("prev").disabled=idx===0;$("next").disabled=idx===items.length-1}
function moveItem(from,to){
  if(to<0||to>=items.length||from===to)return;
  const cur=items[idx];const [x]=items.splice(from,1);items.splice(to,0,x);
  idx=items.indexOf(cur);save();renderChips();renderOrder();refreshNav();
}
function renderOrder(){
  const box=$("orderList");box.innerHTML="";
  items.forEach((it,i)=>{
    const r=document.createElement("div");r.className="ord"+(i===idx?" cur":"");r.draggable=true;
    r.innerHTML='<span class="h">⋮⋮</span><span class="n">'+(i+1)+'</span><span class="t"></span><button class="up">▲</button><button class="dn">▼</button><button class="ed">수정</button><button class="rm">삭제</button>';
    r.querySelector(".t").textContent=it.q;
    r.querySelector(".t").onclick=()=>go(i);
    r.querySelector(".up").onclick=()=>moveItem(i,i-1);
    r.querySelector(".dn").onclick=()=>moveItem(i,i+1);
    r.querySelector(".ed").onclick=()=>editItem(i);
    r.querySelector(".rm").onclick=e=>delItem(i,e.currentTarget);
    if(delArm===i)r.querySelector(".rm").textContent="확인?";
    r.ondragstart=e=>{dragFrom=i;e.dataTransfer.effectAllowed="move";try{e.dataTransfer.setData("text/plain",String(i))}catch(_){}};
    r.ondragover=e=>{e.preventDefault();r.classList.add("over")};
    r.ondragleave=()=>r.classList.remove("over");
    r.ondrop=e=>{e.preventDefault();moveItem(dragFrom,i)};
    box.appendChild(r);
  });
}
const TPL="# 면접 질문·답변 양식\n# '#'으로 시작하는 줄은 안내문이에요. 지워도 되고 그대로 올려도 돼요.\n# 질문은 Q: 뒤에, 답변은 A: 뒤에 쓰세요. 답변은 여러 줄로 써도 돼요.\n# 문항과 문항 사이에는 빈 줄을 한 줄 넣어주세요.\n# K: 뒤에 키워드를 쉼표로 쓰면 키워드 체크가 돼요. (선택)\n# 아래 예시 두 개는 지우고 내 질문과 답변으로 바꿔 쓰세요.\n\nQ: 간단히 자기소개를 해보세요.\nA: 여기에 답변을 작성하세요.\n두 번째 줄도 이어서 쓸 수 있어요.\nK: 키워드1, 키워드2\n\nQ: 지원 동기를 말씀해 보세요.\nA: 여기에 답변을 작성하세요.\n";
const kwList=it=>(it.k||"").split(/[,，、\n]/).map(s=>s.trim()).filter(Boolean);
function renderKws(it,typed){
  const box=$("kws");box.innerHTML="";
  const t=typed==null?null:typed.replace(/\s+/g,"").toLowerCase();
  kwList(it).forEach(k=>{
    const s=document.createElement("span");s.className="kw";
    if(t!==null){const hit=t.includes(k.replace(/\s+/g,"").toLowerCase());s.className+=hit?" ok":" no";s.textContent=(hit?"✓ ":"✗ ")+k}
    else s.textContent=k;
    box.appendChild(s);
  });
}
let st=null;
function saveSoon(){clearTimeout(st);$("saved").textContent="저장 중… · ";st=setTimeout(()=>{save();$("saved").textContent="저장됨 ✓ · "},400)}
async function dl(name,text){
  const m=$("exmsg").offsetParent?$("exmsg"):$("loadmsg");
  try{
    const d=window.claude&&await window.claude.use("downloads");
    if(!d){m.textContent="이 화면에서는 파일 저장을 지원하지 않아요.";return}
    await d.save({filename:name,data:text});m.textContent="저장 완료 ✓";
  }catch(e){m.textContent=e&&e.code==="declined"?"저장을 취소했어요.":"저장하지 못했어요."}
}
const stamp=()=>{const d=new Date();return d.getFullYear()+String(d.getMonth()+1).padStart(2,"0")+String(d.getDate()).padStart(2,"0")};
function exQA(){return items.map(it=>"Q: "+it.q+"\nA: "+it.a+(it.k?"\nK: "+it.k:"")).join("\n\n")+"\n"}
function exMine(){return items.map((it,i)=>{const s=best[it.q];return (i+1)+". Q: "+it.q+"\n\n[원문]\n"+it.a+(it.k?"\n\n[키워드] "+it.k:"")+"\n\n[내 답변"+(s==null?"":" · 최고 "+s+"%")+"]\n"+(it.m||"(작성 안 함)")}).join("\n\n----------\n\n")+"\n"}
let editIdx=-1,delArm=-1,delT=null;
function editItem(i){
  editIdx=i;const add=i<0;
  $("editTitle").textContent=add?"질문 추가":"질문 수정";
  $("eq").value=add?"":items[i].q;$("ea").value=add?"":items[i].a;$("ek").value=add?"":(items[i].k||"");
  $("editPanel").classList.remove("hide");
  $("editPanel").scrollIntoView({block:"nearest"});$("eq").focus();
}
function saveEdit(){
  const q=$("eq").value.trim(),a=$("ea").value.trim(),k=$("ek").value.trim();
  if(!q||!a)return;
  if(editIdx<0){items.push({q,a,k});idx=items.length-1}
  else{const old=items[editIdx];if(old.q!==q&&best[old.q]!=null){best[q]=best[old.q];delete best[old.q]}items[editIdx]={q,a,m:old.m,k,p:old.p}}
  $("editPanel").classList.add("hide");
  save();
  if(!$("preview").classList.contains("hide")){showPreview();return}
  renderChips();renderOrder();renderQ();
}
function delItem(i,btn){
  if(delArm!==i){
    delArm=i;btn.textContent="확인?";clearTimeout(delT);
    delT=setTimeout(()=>{delArm=-1;renderOrder();$("cdel").textContent="삭제";document.querySelectorAll(".dbtn").forEach(b=>b.textContent="삭제")},3000);
    return;
  }
  clearTimeout(delT);delArm=-1;$("cdel").textContent="삭제";
  const cur=items[idx];const [x]=items.splice(i,1);delete best[x.q];
  if(!items.length){save();$("app").classList.add("hide");$("preview").classList.add("hide");$("loader").classList.remove("hide");return}
  const keep=items.includes(cur);
  idx=keep?items.indexOf(cur):Math.min(i,items.length-1);
  save();
  if(!$("preview").classList.contains("hide")){showPreview();return}
  renderChips();renderOrder();
  if(keep)refreshNav();else renderQ();
}
function renderChips(){
  $("chips").innerHTML="";
  const home=document.createElement("button");home.className="chip";home.textContent="⚙︎";home.title="파일 다시 불러오기";
  home.onclick=()=>{$("loader").classList.toggle("hide")};$("chips").appendChild(home);
  const ob=document.createElement("button");ob.className="chip";ob.textContent="↕ 순서";ob.onclick=()=>{$("orderPanel").classList.toggle("hide");renderOrder()};$("chips").appendChild(ob);
  const lb=document.createElement("button");lb.className="chip";lb.textContent="목록";lb.onclick=showPreview;$("chips").appendChild(lb);
  items.forEach((it,i)=>{
    const b=document.createElement("button");const s=best[it.q];
    b.className="chip"+(i===idx?" cur":"")+(s==null?"":s>=80?" s-ok":s>=50?" s-mid":" s-bad");
    b.textContent=i+1;b.onclick=()=>go(i);$("chips").appendChild(b);
  });
}
function renderQ(){
  const it=items[idx];
  $("pos").textContent=`${idx+1} / ${items.length}`;
  $("q").textContent=it.q;
  $("ans").value=it.m||"";$("len").textContent=[...(it.m||"")].length;$("saved").textContent=it.m?"저장됨 ✓ · ":"";
  renderKws(it,it.m?it.m:null);
  $("hint").textContent=it.a;$("hint").classList.add("hide");$("peek").textContent="답변 보기";peeked=false;
  $("result").classList.add("hide");
  const s=best[it.q];$("best").textContent=s==null?"":`최고 ${s}%`;
  $("prev").disabled=idx===0;$("next").disabled=idx===items.length-1;
  $("ans").focus({preventScroll:true});
}
function go(i){idx=i;renderChips();renderQ();renderOrder()}

const isW=ch=>/[\p{L}\p{N}]/u.test(ch);
function compare(orig,typed){
  const O=[],pos=[];
  for(let i=0;i<orig.length;i++){const c=orig[i];if(isW(c)){O.push(c.toLowerCase());pos.push(i)}}
  const T=[],tpos=[];
  for(let i=0;i<typed.length;i++){const c=typed[i];if(isW(c)){T.push(c.toLowerCase());tpos.push(i)}}
  const n=O.length,m=T.length;
  if(!n||!m)return{pct:0,miss:new Set(pos),extra:new Set(tpos)};
  const w=m+1,dp=new Uint16Array((n+1)*w);
  for(let i=1;i<=n;i++)for(let j=1;j<=m;j++)
    dp[i*w+j]=O[i-1]===T[j-1]?dp[(i-1)*w+j-1]+1:Math.max(dp[(i-1)*w+j],dp[i*w+j-1]);
  const hit=new Set(),thit=new Set();let i=n,j=m;
  while(i>0&&j>0){
    if(O[i-1]===T[j-1]){hit.add(pos[i-1]);thit.add(tpos[j-1]);i--;j--}
    else if(dp[(i-1)*w+j]>=dp[i*w+j-1])i--;else j--;
  }
  const lcs=dp[n*w+m];
  const miss=new Set(pos.filter(p=>!hit.has(p)));
  const extra=new Set(tpos.filter(p=>!thit.has(p)));
  return{pct:Math.round(200*lcs/(n+m)),miss,extra};
}
const esc=s=>s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
function markup(s,set,cls){let h="",open=false;for(let i=0;i<s.length;i++){const bad=set.has(i);if(bad&&!open){h+='<mark class="'+cls+'">';open=true}if(!bad&&open&&isW(s[i])){h+="</mark>";open=false}h+=esc(s[i])}return open?h+"</mark>":h}

function grade(){
  const it=items[idx],typed=$("ans").value;
  if(!typed.trim())return;
  const {pct,miss,extra}=compare(it.a,typed);
  const html=markup(it.a,miss,""),mine=markup(typed,extra,"ex");
  $("pct").textContent=pct+"% 일치";
  renderKws(it,typed);$("adopt").textContent="내 답변을 원문으로 저장";$("undo").classList.toggle("hide",!it.p);
  {const ks=kwList(it);if(ks.length){const t=typed.replace(/\s+/g,"").toLowerCase();const n=ks.filter(k=>t.includes(k.replace(/\s+/g,"").toLowerCase())).length;$("kwres").textContent="키워드 "+n+" / "+ks.length+" 포함"}else $("kwres").textContent=""}
  $("pct").style.color=pct>=80?"var(--ok)":pct>=50?"var(--mid)":"var(--bad)";
  $("barfill").style.width=pct+"%";
  $("diff").innerHTML=html;$("diffMine").innerHTML=mine;
  $("result").classList.remove("hide");
  if(best[it.q]==null||pct>best[it.q]){best[it.q]=pct;save()}
  $("best").textContent=`최고 ${best[it.q]}%`;
  renderChips();
  $("result").scrollIntoView({behavior:"smooth",block:"nearest"});
}

$("ans").addEventListener("input",e=>{$("len").textContent=[...e.target.value].length;items[idx].m=e.target.value;renderKws(items[idx],e.target.value.trim()?e.target.value:null);saveSoon()});
$("peek").onclick=()=>{peeked=!peeked;$("hint").classList.toggle("hide",!peeked);$("peek").textContent=peeked?"답변 숨기기":"답변 보기"};
$("grade").onclick=grade;
$("ex1").onclick=()=>dl("면접_질문답변_"+stamp()+".txt",exQA());
$("ex2").onclick=()=>dl("면접_내답변_"+stamp()+".txt",exMine());
$("ex3").onclick=()=>dl("면접_백업_"+stamp()+".json",JSON.stringify({items,best},null,1));
let adoptArm=false,adoptT=null;
$("adopt").onclick=e=>{
  const it=items[idx],typed=$("ans").value.trim();
  if(!typed)return;
  if(!adoptArm){adoptArm=true;e.currentTarget.textContent="정말 바꿀까요? 한 번 더";clearTimeout(adoptT);adoptT=setTimeout(()=>{adoptArm=false;$("adopt").textContent="내 답변을 원문으로 저장"},3000);return}
  clearTimeout(adoptT);adoptArm=false;
  const b=best[it.q];
  it.p=it.a;it.a=typed;$("hint").textContent=it.a;
  grade();
  if(b==null)delete best[it.q];else best[it.q]=b;
  save();$("best").textContent=b==null?"":"최고 "+b+"%";renderChips();
  $("kwres").textContent="저장했어요 ✓ 이제 이 답변이 원문이에요.";
};
$("undo").onclick=()=>{
  const it=items[idx];if(!it.p)return;
  const b=best[it.q];it.a=it.p;delete it.p;$("hint").textContent=it.a;
  grade();
  if(b==null)delete best[it.q];else best[it.q]=b;
  save();$("best").textContent=b==null?"":"최고 "+b+"%";renderChips();
};
$("pvAdd").onclick=()=>editItem(-1);
$("pvStart").onclick=()=>{idx=0;show()};
$("pvLoad").onclick=()=>{$("preview").classList.add("hide");$("loader").classList.remove("hide")};
$("pvToggle").onclick=()=>{const ds=[...document.querySelectorAll("#pvList details")];const open=ds.some(d=>!d.open);ds.forEach(d=>d.open=open);$("pvToggle").textContent=open?"모두 접기":"모두 펼치기"};
$("addBtn").onclick=()=>editItem(-1);
$("esave").onclick=saveEdit;
$("ecancel").onclick=()=>$("editPanel").classList.add("hide");
$("cedit").onclick=()=>editItem(idx);
$("cdel").onclick=e=>delItem(idx,e.currentTarget);

$("reset").onclick=()=>{items[idx].m="";save();$("saved").textContent="";$("ans").value="";renderKws(items[idx],null);$("len").textContent="0";$("result").classList.add("hide");$("ans").focus()};

$("next").onclick=()=>idx<items.length-1&&go(idx+1);

  for(let i=items.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[items[i],items[j]]=[items[j],items[i]]}
  idx=0;save();renderChips();renderQ();renderOrder();
};
$("file").onchange=e=>{
  const f=e.target.files[0];if(!f)return;
  const r=new FileReader();r.onload=()=>{$("loadmsg").textContent="";start(parse(r.result,f.name))};r.readAsText(f,"utf-8");
  e.target.value="";

$("tpl").onclick=()=>dl("면접_양식.txt",TPL);

  $("paste").value="Q: 간단히 자기소개를 해보세요.\nA: 안녕하세요, 경제학과에 지원한 지원자입니다. 저는 일상 속 선택의 이유를 궁금해하며 경제 동아리 활동을 해왔습니다.\n\nQ: 기회비용이 무엇인지 설명해보세요.\nA: 기회비용은 어떤 선택을 할 때 포기해야 하는 다른 선택지 중 가장 가치가 큰 것을 말합니다.";
};
$("clear").onclick=()=>{
  items=[];best={};try{localStorage.removeItem(KEY)}catch(e){}
  $("app").classList.add("hide");$("loader").classList.remove("hide");$("paste").value="";
};
document.addEventListener("keydown",e=>{if((e.ctrlKey||e.metaKey)&&e.key==="Enter"&&items.length)grade()});

if(restore())showPreview();
